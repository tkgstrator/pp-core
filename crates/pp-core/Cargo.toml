[package]
name = "pp-core"
version = "0.1.0"
edition = "2024"
description = "Load and play extended PP scenario scripts"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde-saphyr = "2"
serde_json = { version = "1", optional = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[lib]
crate-type = ["rlib", "cdylib"]

[features]
wasm = ["dep:serde_json", "dep:js-sys", "dep:wasm-bindgen"]
